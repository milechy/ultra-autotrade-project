name: Environment Separation Check

on:
  # 2026-05-27 LAUNCH-GATE-B: paths 限定撤廃。env drift は形を変えて
  # 再発し続けるため、全 PR / push で常時実行する。
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check-env-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify env separation
        run: |
          if [ ! -f backend/.env.production.example ]; then
            echo "::error::backend/.env.production.example が見つかりません"
            exit 1
          fi
          if [ ! -f backend/.env.staging.example ]; then
            echo "::error::backend/.env.staging.example が見つかりません"
            exit 1
          fi
          cp backend/.env.production.example .env.production
          cp backend/.env.staging.example .env.staging
          bash scripts/check_env_separation.sh
      - name: Check .env.staging not referenced in docker-compose
        run: |
          # 2026-04-17以降は .env.staging-new が正式。docker-compose に旧 .env.staging 参照が
          # 再混入していないことを検証する。
          if grep -rn '\.env\.staging[^-]' docker-compose*.yml 2>/dev/null; then
            echo "::error::docker-compose ファイルが旧 .env.staging を参照しています。.env.staging-new を使用してください。"
            exit 1
          fi
          echo "✅ docker-compose に .env.staging 参照なし"
      - name: Check no real .env files committed
        # 旧 env ファイル含む実 .env が tracked に混入していないか検証 (Asana 1214696986457078)。
        run: bash scripts/check_no_committed_env_files.sh
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: error
