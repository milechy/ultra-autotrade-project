name: PR Lint Report

on:
  pull_request:
    branches: [main, staging, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-report:
    name: Ruff + Mypy + Pytest → PR Comment
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ultra_autotrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d ultra_autotrade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ultra_autotrade_test
      APP_ENV: test
      VCR_RECORD_MODE: none

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Enable pgvector
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d ultra_autotrade_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # ─── Ruff check ──────────────────────────────────────────────
      - name: Ruff check
        id: ruff
        continue-on-error: true
        run: |
          ruff check . --output-format=json > /tmp/ruff.json 2>&1 || true
          ISSUES=$(python3 -c "import json; d=json.load(open('/tmp/ruff.json')); print(len(d))" 2>/dev/null || echo "0")
          echo "issues=$ISSUES" >> "$GITHUB_OUTPUT"
          ruff check . 2>&1 | tee /tmp/ruff.txt || true
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Ruff format check
        id: ruff_fmt
        continue-on-error: true
        run: |
          ruff format --check . 2>&1 | tee /tmp/ruff_fmt.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ─── Mypy ────────────────────────────────────────────────────
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: |
          mypy app/ --config-file ../pyproject.toml 2>&1 | tee /tmp/mypy.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ─── Pytest ──────────────────────────────────────────────────
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=json:/tmp/coverage.json \
            --cov-fail-under=80 \
            -q 2>&1 | tee /tmp/pytest.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ─── PR Comment ──────────────────────────────────────────────
      - name: Post results as PR comment
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          RUFF_EXIT: ${{ steps.ruff.outputs.exit_code }}
          RUFF_ISSUES: ${{ steps.ruff.outputs.issues }}
          RUFF_FMT_EXIT: ${{ steps.ruff_fmt.outputs.exit_code }}
          MYPY_EXIT: ${{ steps.mypy.outputs.exit_code }}
          PYTEST_EXIT: ${{ steps.pytest.outputs.exit_code }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const icon = (exit) => exit === '0' ? '✅' : '❌';

            const truncate = (text, max = 2000) =>
              text.length > max ? text.slice(0, max) + '\n...(truncated)' : text;

            const read = (path) => {
              try { return fs.readFileSync(path, 'utf8').trim(); } catch { return '(no output)'; }
            };

            const ruffOut   = truncate(read('/tmp/ruff.txt'));
            const ruffFmt   = truncate(read('/tmp/ruff_fmt.txt'));
            const mypyOut   = truncate(read('/tmp/mypy.txt'));
            const pytestOut = truncate(read('/tmp/pytest.txt'));

            let cov = 'N/A';
            try {
              const covData = JSON.parse(fs.readFileSync('/tmp/coverage.json', 'utf8'));
              cov = `${covData.totals.percent_covered.toFixed(1)}%`;
            } catch {}

            const allPassed =
              process.env.RUFF_EXIT     === '0' &&
              process.env.RUFF_FMT_EXIT === '0' &&
              process.env.MYPY_EXIT     === '0' &&
              process.env.PYTEST_EXIT   === '0';

            let body = `## ${allPassed ? '✅' : '❌'} CI Lint Report\n\n`;
            body += `| Check | Status |\n|-------|--------|\n`;
            body += `| Ruff (lint) | ${icon(process.env.RUFF_EXIT)} |\n`;
            body += `| Ruff (format) | ${icon(process.env.RUFF_FMT_EXIT)} |\n`;
            body += `| Mypy | ${icon(process.env.MYPY_EXIT)} |\n`;
            body += `| Pytest | ${icon(process.env.PYTEST_EXIT)} |\n`;
            body += `| Coverage | ${cov} |\n\n`;

            if (process.env.RUFF_EXIT !== '0') {
              body += `<details><summary>Ruff lint output</summary>\n\n\`\`\`\n${ruffOut}\n\`\`\`\n</details>\n\n`;
            }
            if (process.env.RUFF_FMT_EXIT !== '0') {
              body += `<details><summary>Ruff format output</summary>\n\n\`\`\`\n${ruffFmt}\n\`\`\`\n</details>\n\n`;
            }
            if (process.env.MYPY_EXIT !== '0') {
              body += `<details><summary>Mypy output</summary>\n\n\`\`\`\n${mypyOut}\n\`\`\`\n</details>\n\n`;
            }
            if (process.env.PYTEST_EXIT !== '0') {
              body += `<details><summary>Pytest output</summary>\n\n\`\`\`\n${pytestOut}\n\`\`\`\n</details>\n\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Fail if any check failed
        if: |
          steps.ruff.outputs.exit_code != '0' ||
          steps.ruff_fmt.outputs.exit_code != '0' ||
          steps.mypy.outputs.exit_code != '0' ||
          steps.pytest.outputs.exit_code != '0'
        run: |
          echo "::error::One or more CI checks failed. See PR comment for details."
          exit 1
