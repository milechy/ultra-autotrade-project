name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

env:
  PYTHON_VERSION: "3.11"
  VCR_RECORD_MODE: none

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: mypy app/ --config-file ../pyproject.toml

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ultra_autotrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d ultra_autotrade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ultra_autotrade_test
      APP_ENV: test
      VCR_RECORD_MODE: none

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d ultra_autotrade_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage.xml

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Bandit security scan (via ruff S rules)
        run: ruff check . --select S

      - name: Check for hardcoded secrets
        run: |
          if rg -i '(api_key|secret|password|private_key)\s*=' app/ \
             --glob '!*.pyc' --glob '!__pycache__' \
             | grep -v 'os\.getenv\|os\.environ\|settings\.\|config\.\|\.env\|#\|"""' \
             | grep -v 'test_\|mock_\|fake_\|dummy_'; then
            echo "::error::Potential hardcoded secrets detected!"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Verify .env files are gitignored
        run: |
          if git ls-files --cached | grep -E '\.env\.(staging|production|local)$'; then
            echo "::error::.env files must not be tracked in git (see docs/13_security_design.md)"
            exit 1
          fi
          echo ".env files are properly gitignored."

      - name: Check Decimal usage for financial calculations
        run: |
          if rg 'float\(' app/ --glob '*.py' \
             | grep -i 'price\|amount\|balance\|health_factor\|deposit\|withdraw' \
             | grep -v '#.*noqa\|test_\|mock_'; then
            echo "::warning::Possible float usage in financial calculations. Use Decimal instead (see docs/13_security_design.md)."
          fi

      - name: Validate Anthropic Claude model names
        working-directory: ${{ github.workspace }}
        run: python scripts/validate_anthropic_model.py

  trivy-scan:
    name: Trivy Container & Filesystem Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        continue-on-error: true
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Trivy filesystem scan (backend)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          scan-type: fs
          scan-ref: backend/
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Trivy filesystem scan (frontend)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          scan-type: fs
          scan-ref: frontend/
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          limit-severities-for-sarif: true

      - name: Build Docker image for scanning
        run: docker build -t ultra-autotrade:ci -f Dockerfile .

      - name: Trivy image scan (Docker)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: ultra-autotrade:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          limit-severities-for-sarif: true

      - name: Upload Trivy backend scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy frontend scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload Trivy image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  e2e-smoke:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    needs: [lint]
    continue-on-error: true
    timeout-minutes: 30

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=3072'

      - name: Start mock backend (port 8000)
        run: |
          node -e "
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200, {'Content-Type': 'application/json'});
            res.end(JSON.stringify({status: 'ok'}));
          }).listen(8000, () => console.log('Mock backend on :8000'));
          " &

      - name: Start frontend server
        run: npm run start &
        env:
          PORT: 3000
          NODE_OPTIONS: '--max-old-space-size=512'

      - name: Wait for server
        run: npx wait-on http://localhost:3000 http://localhost:8000/health --timeout 60000

      - name: Run smoke tests
        run: npm run test:e2e:smoke -- --project='Mobile Chrome' --reporter=list
        env:
          STAGING_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ---------------------------------------------------------------------------
  # e2e-smoke-gate: token / 404 / env-isolation 必須 gate (#550 / #552)
  #
  # e2e-smoke (上記) との違い:
  #   - continue-on-error なし → failures / skip-only は PR を block
  #   - mock backend を起動しない → 実 staging backend を直叩き
  #   - 認証情報 (secrets) を注入 → global-setup が実 JWT を取得
  #   - フロントエンドビルド / 起動不要 (tests は Node.js fetch のみ)
  #
  # §7 罠防止 — skip-green を FAIL に変える三重構造 (L3_e2e.sh と同等):
  #   (1) pre-flight:    credentials / backend URL 未設定 → exit 1 (early FAIL)
  #   (2) Playwright:    exit non-zero → job FAIL (continue-on-error なし)
  #   (3) post-run verify (if:always): 0 passed (NO TESTS RAN) → exit 1 → FAIL
  #       → global-setup が auth 失敗し E2E_AUTH_SKIPPED=1 を set したケースを捕捉
  #
  # ⚠️  初回 merge 直後は secrets 名の突合が済むまで本ジョブが赤になります (正常)。
  #      Settings > Secrets > Actions に以下を登録してください:
  #        E2E_BACKEND_URL      — staging backend URL
  #        E2E_PARTNER_EMAIL    — staging partner account email
  #        E2E_PARTNER_PASSWORD — staging partner account password
  #        STAGING_URL          — staging frontend URL (env-isolation 検証用)
  #        CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET (Cloudflare Access 使用時)
  # ---------------------------------------------------------------------------
  e2e-smoke-gate:
    name: E2E Smoke Gate (token/404/env-isolation) — real staging
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    needs: [lint]
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: '1'

    defaults:
      run:
        working-directory: frontend
        shell: bash  # Playwright コンテナは sh (dash) がデフォルト → [[ ]] が [[: not found で無視される

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # §7 罠防止 (1/3): credentials / backend URL 未設定なら skip-green にしない
      - name: Pre-flight — credentials & backend URL 確認
        run: |
          FAIL=0
          if [[ -z "${E2E_PARTNER_EMAIL}" ]]; then
            echo "::error::E2E_PARTNER_EMAIL が未設定 (secrets.E2E_PARTNER_EMAIL)"
            FAIL=1
          fi
          if [[ -z "${E2E_PARTNER_PASSWORD}" ]]; then
            echo "::error::E2E_PARTNER_PASSWORD が未設定 (secrets.E2E_PARTNER_PASSWORD)"
            FAIL=1
          fi
          if [[ -z "${NEXT_PUBLIC_BACKEND_BASE_URL}" ]]; then
            echo "::error::NEXT_PUBLIC_BACKEND_BASE_URL が未設定 (secrets.E2E_BACKEND_URL)"
            FAIL=1
          fi
          if [[ "${FAIL}" -eq 1 ]]; then
            echo "::error::e2e-smoke-gate は実 staging credentials 必須 gate です。"
            echo "::notice::初回 merge 直後は secrets 名の突合が済むまで赤になります (正常)。"
            exit 1
          fi
          echo "Pre-flight OK: credentials / backend URL 設定確認完了"
        env:
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
          NEXT_PUBLIC_BACKEND_BASE_URL: ${{ secrets.E2E_BACKEND_URL }}

      # §7 罠防止 (2/3): Playwright exit non-zero → job FAIL (continue-on-error なし)
      - name: Run gate tests (token / 404 / env-isolation)
        run: |
          npx playwright test e2e/smoke/token-404-env.spec.ts \
            --project='Desktop Chrome' \
            --reporter=list
        env:
          NEXT_PUBLIC_BACKEND_BASE_URL: ${{ secrets.E2E_BACKEND_URL }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          E2E_PARTNER_EMAIL: ${{ secrets.E2E_PARTNER_EMAIL }}
          E2E_PARTNER_PASSWORD: ${{ secrets.E2E_PARTNER_PASSWORD }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      # §7 罠防止 (3/3): NO TESTS RAN (skip-only) は FAIL — L3_e2e.sh と同等
      - name: Verify gate results — NO TESTS RAN は FAIL
        if: always()
        run: |
          RESULTS="playwright-results.json"
          if [[ ! -f "${RESULTS}" ]]; then
            echo "::error::playwright-results.json が出力されませんでした"
            exit 1
          fi
          if command -v jq >/dev/null 2>&1; then
            PASSED=$(jq '.stats.expected // 0' "${RESULTS}")
            FAILED=$(jq '.stats.unexpected // 0' "${RESULTS}")
            SKIPPED=$(jq '.stats.skipped // 0' "${RESULTS}")
          else
            PASSED=$(python3 -c "import json; d=json.load(open('${RESULTS}')); print(d.get('stats',{}).get('expected',0))" 2>/dev/null || echo 0)
            FAILED=$(python3 -c "import json; d=json.load(open('${RESULTS}')); print(d.get('stats',{}).get('unexpected',0))" 2>/dev/null || echo 0)
            SKIPPED=$(python3 -c "import json; d=json.load(open('${RESULTS}')); print(d.get('stats',{}).get('skipped',0))" 2>/dev/null || echo 0)
          fi
          echo "passed: ${PASSED} / failed: ${FAILED} / skipped: ${SKIPPED}"
          if [[ "${FAILED}" -gt 0 ]]; then
            echo "::error::${FAILED} テストが失敗しました (詳細: ${RESULTS})"
            exit 1
          fi
          if [[ "${PASSED}" -eq 0 ]]; then
            echo "::error::NO TESTS RAN — 0 passed / ${SKIPPED} skipped"
            echo "::error::global-setup が auth 失敗し E2E_AUTH_SKIPPED=1 を set した可能性。"
            echo "::error::credentials (E2E_PARTNER_EMAIL / E2E_PARTNER_PASSWORD) と"
            echo "::error::NEXT_PUBLIC_BACKEND_BASE_URL (secrets.E2E_BACKEND_URL) を確認してください。"
            exit 1
          fi
          echo "gate PASS: ${PASSED} passed / ${SKIPPED} skipped / 0 failed"
