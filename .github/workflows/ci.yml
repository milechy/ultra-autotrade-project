name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

env:
  PYTHON_VERSION: "3.11"
  VCR_RECORD_MODE: none

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: mypy app/ --config-file ../pyproject.toml

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ultra_autotrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d ultra_autotrade_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ultra_autotrade_test
      APP_ENV: test
      VCR_RECORD_MODE: none

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d ultra_autotrade_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run pytest with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: backend/coverage.xml

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Bandit security scan (via ruff S rules)
        run: ruff check . --select S

      - name: Check for hardcoded secrets
        run: |
          if rg -i '(api_key|secret|password|private_key)\s*=' app/ \
             --glob '!*.pyc' --glob '!__pycache__' \
             | grep -v 'os\.getenv\|os\.environ\|settings\.\|config\.\|\.env\|#\|"""' \
             | grep -v 'test_\|mock_\|fake_\|dummy_'; then
            echo "::error::Potential hardcoded secrets detected!"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: Verify .env files are gitignored
        run: |
          if git ls-files --cached | grep -E '\.env\.(staging|production|local)$'; then
            echo "::error::.env files must not be tracked in git (see docs/13_security_design.md)"
            exit 1
          fi
          echo ".env files are properly gitignored."

      - name: Check Decimal usage for financial calculations
        run: |
          if rg 'float\(' app/ --glob '*.py' \
             | grep -i 'price\|amount\|balance\|health_factor\|deposit\|withdraw' \
             | grep -v '#.*noqa\|test_\|mock_'; then
            echo "::warning::Possible float usage in financial calculations. Use Decimal instead (see docs/13_security_design.md)."
          fi

  trivy-scan:
    name: Trivy Container & Filesystem Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Trivy filesystem scan (backend)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          scan-type: fs
          scan-ref: backend/
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy filesystem scan (frontend)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          scan-type: fs
          scan-ref: frontend/
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Build Docker image for scanning
        run: docker build -t ultra-autotrade:ci -f Dockerfile .

      - name: Trivy image scan (Docker)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: ultra-autotrade:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy backend scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload Trivy frontend scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload Trivy image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  e2e-smoke:
    name: E2E Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        run: npm run build

      - name: Start mock backend (port 8000)
        run: |
          node -e "
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200, {'Content-Type': 'application/json'});
            res.end(JSON.stringify({status: 'ok'}));
          }).listen(8000, () => console.log('Mock backend on :8000'));
          " &

      - name: Start frontend server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 http://localhost:8000/health --timeout 30000

      - name: Run smoke tests
        run: npm run test:e2e -- --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
