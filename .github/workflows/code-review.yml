name: Open Code Review (LLM PR review)

# Alibaba Open Code Review (ocr) で PR diff を Claude にレビューさせ、結果を PR コメントに投稿する。
# 現行の手動 Gate 6 (/codex:review) を補完。backend/app/aave/ 変更時のセキュリティ検査を自動化。
#
# トリガー: backend のコードを変更した PR（ci.yml 本体には触れない独立 workflow）

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'scripts/run_code_review.sh'

permissions:
  contents: read
  pull-requests: write   # PR コメント投稿のため

jobs:
  llm-review:
    name: LLM コードレビュー
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # base..head の diff を取るため全履歴

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Run Open Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          OUTPUT: ${{ runner.temp }}/ocr-review.json
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret が未設定のためレビューをスキップ"
            exit 0
          fi
          bash scripts/run_code_review.sh

      - name: Post review as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ runner.temp }}/ocr-review.json
        run: |
          if [ ! -f "$OUTPUT" ]; then
            echo "レビュー出力なし — スキップ"
            exit 0
          fi
          {
            echo "## 🤖 Open Code Review (LLM)"
            echo ""
            echo '```json'
            jq -r '.' "$OUTPUT" 2>/dev/null | head -200 || cat "$OUTPUT" | head -200
            echo '```'
            echo ""
            echo "_自動生成: scripts/run_code_review.sh / 手動 Gate 6 を補完_"
          } > /tmp/ocr-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ocr-comment.md || \
            echo "::warning::PR コメント投稿に失敗（権限 or レート制限）"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-review
          path: ${{ runner.temp }}/ocr-review.json
          if-no-files-found: ignore
