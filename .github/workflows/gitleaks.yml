name: Secret Scan (gitleaks)

# 本物のシークレットスキャン。ci.yml security-check の grep ベース検出を補完し、
# private key / API key / token の漏洩を git 履歴 + PR diff で検出する。
# 検出時は job が fail する。
#
# blocking 化: branch protection の required status checks に "Secret Scan (gitleaks) / gitleaks"
# を追加すること（.github/branch-protection-setup.md 参照）。追加するまでは advisory（赤 X は出るがマージは止まらない）。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # PR への検出サマリ投稿用

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # git 履歴全体をスキャンするため

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
