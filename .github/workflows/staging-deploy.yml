name: Staging Deploy

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Hetzner Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Deploy to Hetzner VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$HETZNER_HOST" ]; then
            echo "::warning::SSH credentials not configured. Skipping deploy."
            echo "Set HETZNER_SSH_KEY and HETZNER_HOST secrets to enable."
            exit 0
          fi

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy
          ssh -i ~/.ssh/deploy_key "${HETZNER_USER}@${HETZNER_HOST}" << 'DEPLOY_SCRIPT'
            cd /opt/ultra-autotrade
            git pull origin staging
            ./deploy.sh staging
          DEPLOY_SCRIPT

          echo "Deploy completed successfully"
