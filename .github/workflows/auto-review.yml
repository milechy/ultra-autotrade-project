name: Automated Code Review

on:
  push:
    branches:
      - 'dev/**'  # dev/* ブランチのみ
      - 'feature/**'
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: write
  issues: write
  
jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # For git diff
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openai requests
      
      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="HEAD~1"
          fi
          
          CHANGED_FILES=$(git diff --name-only $BASE_REF HEAD | grep -E '\.(py|ts|tsx|js|jsx)$' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No code files changed"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed files: $CHANGED_FILES"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT
          fi
       
      - name: Run Codex review
        if: false  # ← 一時的に完全無効化
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/codex_review.py --files "${{ steps.changed-files.outputs.files }}" --output review_result.json

      - name: Upload review result
        if: steps.changed-files.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-result
          path: review_result.json
          retention-days: 7
      
      - name: Create dummy review result if needed
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          if [ ! -f review_result.json ]; then
            echo '{"files_reviewed":0,"issues":[],"suggestions":[],"review_time_seconds":0}' > review_result.json
          fi

      - name: Send Slack notification
        if: steps.changed-files.outputs.has_changes == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url || '' }}"
          python scripts/slack_notify.py \
            --review review_result.json \
            --pr-url "$PR_URL"
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync('review_result.json', 'utf8'));
            
            let comment = '## 🤖 Automated Code Review\n\n';
            comment += `**Files Reviewed:** ${review.files_reviewed}\n`;
            comment += `**⚠️ Issues:** ${review.issues.length}\n`;
            comment += `**💡 Suggestions:** ${review.suggestions.length}\n\n`;
            
            if (review.issues.length > 0) {
              comment += '### Issues\n';
              review.issues.slice(0, 5).forEach(issue => {
                comment += `- **${issue.file}:${issue.line}** - ${issue.message}\n`;
                if (issue.suggestion) {
                  comment += `  > 💡 ${issue.suggestion}\n`;
                }
              });
              comment += '\n';
            }
            
            if (review.suggestions.length > 0) {
              comment += '### Suggestions\n';
              review.suggestions.slice(0, 3).forEach(sugg => {
                comment += `- **${sugg.file}:${sugg.line}** - ${sugg.message}\n`;
              });
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if critical issues found
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          # Check if review found critical errors
          CRITICAL_COUNT=$(python -c "
          import json
          with open('review_result.json') as f:
              data = json.load(f)
              print(sum(1 for i in data['issues'] if i['severity'] == 'error'))
          ")
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ $CRITICAL_COUNT critical issues found"
            exit 1
          fi
