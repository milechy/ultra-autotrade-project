# ============================================================
# upstream.production.conf — Blue/Green active upstream (production only)
#
# このファイルは scripts/deploy_production.sh が
# Blue/Green 切替時に書き換える。手動編集禁止 (ロールバック時を除く)。
#
# staging 環境は upstream.staging.conf を使用 (ファイル共有禁止)。
#
# 形式: 単一行のみ (2026-05-12 RCA 以降の新形式)。
#   set $backend backend-blue:8000;
# または:
#   set $backend backend-green:8000;
#
# このファイルは nginx.conf の `location /` 内で include され、
# `$backend` 変数を `proxy_pass http://$backend;` に渡す。
# resolver 127.0.0.11 valid=5s (nginx.conf 定義) が TTL 5s で
# hostname を再解決するため、backend container 再生成で IP が変動しても
# nginx が古い IP に固着しない。
#
# 旧形式 (2026-05-12 以前) は `server backend-blue:8000 ...;` だったが、
# upstream block + hostname 直書きで起動時 1 回しか解決されない構造的バグ
# (本番 502 を生んだ) のため変更。詳細:
# docs/postmortems/2026-05-12_nginx_upstream_ip_pin.md
#
# 書き換え方法 (deploy script 内):
#   1. awk で新しい内容を一時ファイルに書く
#   2. cat > で in-place 書き換え (inode 保持、bind-mount 対応)
#   3. nginx 起動中なら docker exec で念のためコンテナ内も同期
# ※ sed -i / mv は禁止 (inode ズレ・memory 由来の運用ルール)
# ============================================================
set $backend backend-blue:8000;
