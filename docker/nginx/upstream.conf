# ============================================================
# upstream.conf — Blue/Green active upstream
#
# このファイルは scripts/deploy_production.sh / deploy_staging.sh が
# Blue/Green 切替時に書き換える。手動編集禁止 (ロールバック時を除く)。
#
# 形式: 単一行のみ。
#   server backend-blue:8000 max_fails=3 fail_timeout=10s;
# または:
#   server backend-green:8000 max_fails=3 fail_timeout=10s;
#
# Docker ネットワーク内で backend-blue / backend-green サービス名が
# DNS 解決される (production-net / staging-net の各ネットワーク内)。
#
# 書き換え方法 (deploy script 内):
#   1. 一時ファイルに新しい行を書く
#   2. mv で原子置換
#   3. docker exec <nginx> nginx -s reload
# ※ sed -i は禁止 (memory 由来の運用ルール)
# ============================================================
server backend-blue:8000 max_fails=3 fail_timeout=10s;
