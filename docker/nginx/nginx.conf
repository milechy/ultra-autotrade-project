# ============================================================
# nginx.conf — Ultra AutoTrade ゼロダウンタイムデプロイ用
#
# 経緯:
#   PR #136 (docs/research/zero_downtime_deploy.md) の案A実装。
#   nginx を backend の前段に置き、`upstream.conf` の単一行を書き換えて
#   `nginx -s reload` することで Blue/Green を無停止切替する。
#
# 動作:
#   - listen 8080 で外部公開（cloudflared が localhost:8080 → ここに転送）
#   - upstream backend_active は /etc/nginx/conf.d/upstream.conf を include
#     → upstream.conf を書き換えて reload するだけで切替完了
#   - nginx -s reload は Linux カーネル保証のゼロダウンタイム reload
#
# Production/Staging 共通の設定。本番のみ /nginx-health で外部監視を許可する。
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # 基本設定
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ログフォーマット (upstream 切替の検証用に upstream_addr を含める)
    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream=$upstream_addr '
                            'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log;

    # Cloudflare Tunnel 経由の実IP復元
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # ===== Blue/Green upstream =====
    # /etc/nginx/conf.d/upstream.conf に "server backend-blue:8000;" 等の
    # 単一行が入っており、デプロイスクリプトが書き換えて reload する。
    upstream backend_active {
        include /etc/nginx/conf.d/upstream.conf;
        keepalive 32;
    }

    # ===== バックエンドフロント =====
    server {
        listen 8080 default_server;
        server_name _;

        # 大きめのアップロード許容 (Knowledge Hub 等)
        client_max_body_size 20m;

        # nginx 自身のヘルスチェック (デプロイスクリプトが事前確認に使う)
        location = /nginx-health {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://backend_active;

            # keepalive を効かせる
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # オリジンヘッダ伝搬
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # FastAPI startup 完了前のリクエストは 502 になる可能性があるので
            # 短時間の retry を許可 (idempotent な GET のみ)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # タイムアウト (LLM 判定が長くなる可能性を考慮して 90s)
            proxy_connect_timeout 5s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }
    }
}
