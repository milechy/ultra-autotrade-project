# ============================================================
# upstream.staging.conf — Blue/Green active upstream (staging only)
#
# このファイルは scripts/deploy_staging.sh が
# Blue/Green 切替時に書き換える。手動編集禁止 (ロールバック時を除く)。
#
# production 環境は upstream.production.conf を使用 (ファイル共有禁止)。
#
# 形式: 単一行のみ (2026-05-12 RCA 以降の新形式)。
#   set $backend backend-blue:8000;
# または:
#   set $backend backend-green:8000;
#
# 旧形式 `server backend-blue:8000 ...;` からの変更理由・運用ルールは
# upstream.production.conf のヘッダコメントと
# docs/postmortems/2026-05-12_nginx_upstream_ip_pin.md を参照。
# ============================================================
set $backend backend-blue:8000;
