# ============================================================
# upstream.staging.conf — Blue/Green active upstream (staging only)
#
# このファイルは scripts/deploy_staging.sh が
# Blue/Green 切替時に書き換える。手動編集禁止 (ロールバック時を除く)。
#
# production 環境は upstream.production.conf を使用 (ファイル共有禁止)。
#
# 形式: 単一行のみ。
#   server backend-blue:8000 max_fails=3 fail_timeout=10s;
# または:
#   server backend-green:8000 max_fails=3 fail_timeout=10s;
#
# 書き換え方法 (deploy script 内):
#   1. awk で新しい内容を一時ファイルに書く
#   2. cat > で in-place 書き換え (inode 保持、bind-mount 対応)
#   3. nginx 起動中なら docker exec で念のためコンテナ内も同期
# ※ sed -i / mv は禁止 (inode ズレ・memory 由来の運用ルール)
# ============================================================
server backend-blue:8000 max_fails=3 fail_timeout=10s;
