# Ruff 設定（backend/ruff.toml）

# 対象Pythonバージョン
target-version = "py311"

# プロジェクト全体の設定
line-length = 100
exclude = [
    "__pycache__",
    ".venv",
]

# リント（エラーチェック）設定
[lint]
# 有効にするルールグループ
# E: PEP8系エラー, F: バグ系, I: import整形
select = ["E", "F", "I"]

# とりあえずうるさいやつは無視
ignore = [
    "E501",  # 行が長い警告はとりあえず無視
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
# テストファイルではassert, 仮パスワード, tmpファイル使用は許容する
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "S108"]
# migration は定数のみで構成されたテンプレート SQL のため S608 (SQL injection) は false positive
"alembic/versions/**/*.py" = ["S608"]

