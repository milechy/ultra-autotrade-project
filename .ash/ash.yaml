# ASH Configuration for Ultra AutoTrade
fail_on_findings: false

exclude_paths:
  # Build artifacts & caches
  - "**/.next/**"
  - "**/.mypy_cache/**"
  - "**/node_modules/**"
  - "**/__pycache__/**"
  - "**/.venv/**"
  - "**/*.pyc"
  # OctoBot upstream (not our code)
  - "octobot/**"
  - "tentacles/**"
  - "user/**"
  - "**/layout.html"
  # Test fixtures
  - "tests/cassettes/**"
  # ASH output
  - ".ash/ash_output/**"

reporters:
  junitxml:
    enabled: false

reports:
  formats:
    - json
    - markdown
    - html
