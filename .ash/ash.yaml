# ASH Configuration for Ultra AutoTrade
fail_on_findings: false

exclude_paths:
  - node_modules
  - .next
  - __pycache__
  - .venv
  - "*.pyc"
  # OctoBot upstream code (not our responsibility)
  - octobot/
  - tentacles/
  - user/
  - layout.html
  # Test fixtures
  - tests/cassettes/
  - "*/test_exchange_client.py"

# detect-secrets baseline（false positive除外）
scanners:
  bandit:
    enabled: true
  semgrep:
    enabled: true
  grype:
    enabled: true
  checkov:
    enabled: true
  detect-secrets:
    enabled: true

reports:
  formats:
    - json
    - markdown
    - html
