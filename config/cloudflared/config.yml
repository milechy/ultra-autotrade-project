# Cloudflare Named Tunnel 設定ファイル
#
# 使用前に以下を実施:
#   1. Hetzner VPS で `cloudflared tunnel create ultra-autotrade` を実行
#   2. <TUNNEL_ID> を実際の Tunnel ID に置換
#   3. credentials-file パスを確認
#
# 参照: docs/32_named_tunnel_migration.md

tunnel: e558c833-014f-40a0-ad84-4562cf01af20
credentials-file: /root/.cloudflared/e558c833-014f-40a0-ad84-4562cf01af20.json

ingress:
  - hostname: api.ultra-auto-trade.com
    service: http://localhost:8000
  - hostname: app.ultra-auto-trade.com
    service: http://localhost:3000
  - service: http_status:404
