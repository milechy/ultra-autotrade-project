version: "3.9"

services:
  backend:
    container_name: ultra-autotrade-backend-staging
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env.staging       # staging 用の環境変数ファイル（Git 管理外）
    ports:
      - "8000:8000"
    restart: always
    # 必要に応じてログローテーションや制限を設定
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
