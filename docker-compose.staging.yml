version: "3.9"

volumes:
  ultra-state:
    driver: local
  postgres-data:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ultra-autotrade-postgres-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ultra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ultra_autotrade}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    container_name: ultra-autotrade-backend-staging
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env.staging       # staging 用の環境変数ファイル（Git 管理外）
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ultra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ultra_autotrade}
    ports:
      - "8000:8000"
    volumes:
      - ultra-state:/var/run/ultra:rw
      - ./backend/data:/app/backend/data:rw
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    container_name: ultra-autotrade-frontend-staging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-https://api.ultra-auto-trade.com}
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-https://api.ultra-auto-trade.com}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
