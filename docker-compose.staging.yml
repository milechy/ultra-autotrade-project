version: "3.9"

# ============================================================
# docker-compose.staging.yml
# 真のStaging環境（staging.ultra-auto-trade.com / api-staging.ultra-auto-trade.com）
#
# 設計方針 (2026-04-17 B案リネーム):
#   - Shadow Mode専用 (AI_SHADOW_MODE=true / REBALANCE_SHADOW_MODE=true)
#   - Base Sepoliaテストネット流用 (AAVE_NETWORK=base-sepolia)
#   - 完全独立DB (ultra_autotrade_staging)
#   - portは production と重複しないよう 127.0.0.1 バインドで分離
#     frontend: 127.0.0.1:3001  (production: 0.0.0.0:3000)
#     backend (旧 single): 127.0.0.1:8001  (production blue: 127.0.0.1:8010)
#     postgres: 127.0.0.1:5433  (production: 0.0.0.0:5432)
#   - Cloudflare Tunnel Ingress への staging URL 追加は Phase 4 で実施
#
# 2026-04-27 ゼロダウンタイムデプロイ (Asana 1214253004741363) で導入:
#   - backend を backend-blue / backend-green に分割
#   - nginx (127.0.0.1:8082) を前段に追加 (production の 8080 と区別)
#   - host側ポートは production (8010/8011) と衝突回避のため 8020/8021 を使用
#   - staging は外部公開なしのため cloudflared フォールバックは無し
#
# デプロイ: scripts/deploy_staging.sh
# 環境変数: .env.staging-new
# COMPOSE_PROJECT_NAME: ultra-autotrade-staging  (.env.staging-new に定義)
# ============================================================
#
# NOTE: The Loki Docker logging driver must be installed on the host before starting this stack:
#   docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
# Verify installation with: docker plugin ls

volumes:
  postgres-data-staging-new:
    name: ultra-autotrade-staging_postgres-data
    driver: local
  ultra-state-staging-new:
    name: ultra-autotrade-staging_ultra-state
    driver: local
  ultra-log-staging-new:
    name: ultra-autotrade-staging_ultra-log
    driver: local
  loki-data-staging-new:
    name: ultra-autotrade-staging_loki-data
    driver: local
  nginx-log-staging-new:
    name: ultra-autotrade-staging_nginx-log
    driver: local

networks:
  staging-net:
    name: ultra-autotrade-staging_default

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: ultra-autotrade-loki-staging-new
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data-staging-new:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: always
    networks:
      - staging-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: ultra-autotrade-promtail-staging-new
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    restart: always
    networks:
      - staging-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ultra-autotrade-postgres-staging-new
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ultra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ultra_autotrade_staging}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data-staging-new:/var/lib/postgresql/data
    restart: always
    networks:
      - staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultra} -d ${POSTGRES_DB:-ultra_autotrade_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=postgres,env=staging"

  # ===== Blue/Green Backend =====
  # active 側のみ nginx の upstream.conf に登録される。
  # host側 port は production (8010/8011) と衝突回避のため 8020/8021。

  backend-blue:
    container_name: ultra-autotrade-backend-blue-staging-new
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info"
    env_file:
      - .env.staging-new
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ultra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ultra_autotrade_staging}
      REBALANCE_SHADOW_MODE: "true"
      AI_SHADOW_MODE: "true"
      DEPLOY_SLOT: "blue"
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    memswap_limit: ${BACKEND_MEM_LIMIT:-768m}
    ports:
      # 内部検証用 (deploy script が /health を直接ポーリング)。外部公開なし。
      - "127.0.0.1:8020:8000"
    volumes:
      - ultra-state-staging-new:/var/run/ultra:rw
      - ./backend/data:/app/backend/data:rw
      - ultra-log-staging-new:/var/log/ultra-autotrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - staging-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=backend-blue,env=staging"

  backend-green:
    container_name: ultra-autotrade-backend-green-staging-new
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info"
    env_file:
      - .env.staging-new
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ultra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ultra_autotrade_staging}
      REBALANCE_SHADOW_MODE: "true"
      AI_SHADOW_MODE: "true"
      DEPLOY_SLOT: "green"
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    memswap_limit: ${BACKEND_MEM_LIMIT:-768m}
    ports:
      - "127.0.0.1:8021:8000"
    volumes:
      - ultra-state-staging-new:/var/run/ultra:rw
      - ./backend/data:/app/backend/data:rw
      - ultra-log-staging-new:/var/log/ultra-autotrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - staging-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=backend-green,env=staging"

  # ===== Reverse Proxy =====
  # production の :8080 と区別するため staging は 127.0.0.1:8082 にバインド。
  # dry-run 検証は curl http://127.0.0.1:8082/health で実施 (staging URL は Phase 4 以降)。
  nginx:
    image: nginx:1.27-alpine
    container_name: ultra-autotrade-nginx-staging-new
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/upstream.staging.conf:/etc/nginx/conf.d/upstream.conf:rw
      - nginx-log-staging-new:/var/log/nginx
    depends_on:
      - backend-blue
    restart: always
    networks:
      - staging-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=nginx,env=staging"

  frontend:
    container_name: ultra-autotrade-frontend-staging-new
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-https://api-staging.ultra-auto-trade.com}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api-staging.ultra-auto-trade.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-staging.ultra-auto-trade.com}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_DEFAULT_CHAIN: ${NEXT_PUBLIC_DEFAULT_CHAIN:-}
        NEXT_PUBLIC_DEFAULT_CHAIN_ID: ${NEXT_PUBLIC_DEFAULT_CHAIN_ID:-84532}
        NEXT_PUBLIC_MAINNET_RPC: ${NEXT_PUBLIC_MAINNET_RPC:-}
        NEXT_PUBLIC_ARBITRUM_ONE_RPC: ${NEXT_PUBLIC_ARBITRUM_ONE_RPC:-}
        NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC: ${NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC:-}
        NEXT_PUBLIC_BASE_RPC: ${NEXT_PUBLIC_BASE_RPC:-}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC:-}
        NEXT_PUBLIC_OPTIMISM_RPC: ${NEXT_PUBLIC_OPTIMISM_RPC:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        # Next.js ビルド OOM 対策 (CLAUDE.md §2026-05-19 GID 1214828243363427)
        # staging-new は 7.6GB RAM / swap なし → 4096MB が安全下限。
        # 実ビルドログでピーク確認後に値を調整すること。
        NODE_BUILD_MAX_OLD_SPACE_SIZE: ${NODE_BUILD_MAX_OLD_SPACE_SIZE:-4096}
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-https://api-staging.ultra-auto-trade.com}
      # SSR は Docker ネットワーク内の nginx (内部ポート 8080) 経由で backend に到達する。
      # Blue/Green 切替時にも frontend の再起動なしでバックエンドが追従する。
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://nginx:8080}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - nginx
    restart: always
    networks:
      - staging-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=frontend,env=staging"
