version: "3.9"

# ============================================================
# docker-compose.production.yml
# 本番環境（app.ultra-auto-trade.com / api.ultra-auto-trade.com）
#
# 経緯:
#   - 2026-04-17 B案リネームで旧 docker-compose.staging.yml を本ファイルとして正式化。
#   - 2026-04-24 container_name 衝突インシデント後、以下を根本解決:
#       (a) container_name を *-production suffix に変更 (旧 *-staging)
#       (b) volumes に name: を明示して COMPOSE_PROJECT_NAME 変更から防御
#       (c) 独自 network を定義して staging.yml との合成を物理的に分離
#       (d) backend.environment.DATABASE_URL を削除 (env_file の .env.production に直接記述、
#           compose ${} 展開に依存しない)
#   - 2026-04-27 ゼロダウンタイムデプロイ (Asana 1214253004741363) で導入:
#       (e) 旧 backend を backend-blue / backend-green に分割し Blue/Green 化
#       (f) nginx (8080) を前段に追加。docker/nginx/upstream.conf の単一行を
#           書き換えて nginx -s reload することで無停止切替
#       (g) frontend SSR の BACKEND_BASE_URL を http://nginx:8080 に変更 (内部 Docker DNS)
#       (h) cloudflared Ingress を localhost:8000 → localhost:8080 に Cloudflare Dashboard で
#           手動切替する (docs/19_operations_runbook.md §ゼロダウンタイムデプロイ運用 参照)
#
# デプロイ: scripts/deploy_production.sh
# 環境変数: .env.production  (DATABASE_URL をフルURLで定義すること)
# ============================================================
#
# NOTE: The Loki Docker logging driver must be installed on the host before starting this stack:
#   docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
# Verify installation with: docker plugin ls

volumes:
  ultra-state:
    name: ultra-autotrade-project_ultra-state
    driver: local
  postgres-data:
    name: ultra-autotrade-project_postgres-data
    driver: local
  loki-data:
    name: ultra-autotrade-project_loki-data
    driver: local
  ultra-log-staging:
    name: ultra-autotrade-project_ultra-log-staging
    driver: local
  nginx-log:
    name: ultra-autotrade-project_nginx-log
    driver: local

networks:
  production-net:
    name: ultra-autotrade-project_default

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: ultra-autotrade-loki-production
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: always
    networks:
      - production-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: ultra-autotrade-promtail-production
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    restart: always
    networks:
      - production-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ultra-autotrade-postgres-production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ultra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ultra_autotrade}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - production-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultra} -d ${POSTGRES_DB:-ultra_autotrade}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=postgres,env=production"

  # ===== Blue/Green Backend =====
  # 両者は build / env / volume が同一。container_name と公開ポートのみ異なる。
  # active 側のみ nginx の upstream.conf に登録される。

  backend-blue:
    container_name: ultra-autotrade-backend-blue-production
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info"
    env_file:
      - .env.production
    environment:
      REBALANCE_SHADOW_MODE: "false"
      DEPLOY_SLOT: "blue"
    ports:
      # 内部検証用 (deploy script が /health を直接ポーリング)。外部公開なし。
      - "127.0.0.1:8010:8000"
      # ── Cloudflare Tunnel フォールバック (任意) ──
      # nginx 死亡時に cloudflared を直接 backend-blue に向け直すための追加公開。
      # 有効化する場合は下記のコメントアウトを外し、Cloudflare Dashboard で
      # ingress に http://localhost:8000 のフォールバックエントリを追加する。
      # 詳細: docs/19_operations_runbook.md §ゼロダウンタイムデプロイ運用
      # - "8000:8000"
    volumes:
      - ultra-state:/var/run/ultra:rw
      - ./backend/data:/app/backend/data:rw
      - ultra-log-staging:/var/log/ultra-autotrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - production-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=backend-blue,env=production"

  backend-green:
    container_name: ultra-autotrade-backend-green-production
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --log-level info"
    env_file:
      - .env.production
    environment:
      REBALANCE_SHADOW_MODE: "false"
      DEPLOY_SLOT: "green"
    ports:
      - "127.0.0.1:8011:8000"
    volumes:
      - ultra-state:/var/run/ultra:rw
      - ./backend/data:/app/backend/data:rw
      - ultra-log-staging:/var/log/ultra-autotrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - production-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=backend-green,env=production"

  # ===== Reverse Proxy =====
  # nginx -s reload は POSIX 仕様で既存接続を引き継ぐため、ゼロダウンタイム保証。
  # upstream.conf を書き換えて reload するだけで Blue/Green 切替が完了する。
  nginx:
    image: nginx:1.27-alpine
    container_name: ultra-autotrade-nginx-production
    ports:
      - "8080:8080"
      - "8000:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/upstream.production.conf:/etc/nginx/conf.d/upstream.conf:rw
      - nginx-log:/var/log/nginx
    depends_on:
      - backend-blue
    restart: always
    networks:
      - production-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=nginx,env=production"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ultra-autotrade-cloudflared-production
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: "host"
    env_file:
      - .env.production
    depends_on:
      - nginx
      - frontend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: ultra-autotrade-frontend-production
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-https://api.ultra-auto-trade.com}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.ultra-auto-trade.com}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.ultra-auto-trade.com}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        # 2026-05-01: Base Mainnet (chain 8453) を build-arg のデフォルト化。
        # .env.production が空でも frontend は base mainnet として焼き込まれる。
        NEXT_PUBLIC_DEFAULT_CHAIN: ${NEXT_PUBLIC_DEFAULT_CHAIN:-base}
        NEXT_PUBLIC_DEFAULT_CHAIN_ID: ${NEXT_PUBLIC_DEFAULT_CHAIN_ID:-8453}
        NEXT_PUBLIC_MAINNET_RPC: ${NEXT_PUBLIC_MAINNET_RPC:-}
        NEXT_PUBLIC_ARBITRUM_ONE_RPC: ${NEXT_PUBLIC_ARBITRUM_ONE_RPC:-}
        NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC: ${NEXT_PUBLIC_ARBITRUM_SEPOLIA_RPC:-}
        NEXT_PUBLIC_BASE_RPC: ${NEXT_PUBLIC_BASE_RPC:-}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC:-}
        NEXT_PUBLIC_OPTIMISM_RPC: ${NEXT_PUBLIC_OPTIMISM_RPC:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-https://api.ultra-auto-trade.com}
      # SSR (Next.js サーバー側) は内部 nginx 経由で backend に到達する。
      # Blue/Green 切替時にも frontend の再起動なしでバックエンドが追従する。
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://nginx:8080}
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    restart: always
    networks:
      - production-net
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-timeout: "10s"
        loki-external-labels: "service=frontend,env=production"
